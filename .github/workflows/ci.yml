name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget:
    name: Validate Widget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: widget/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: API docs coverage (TSDoc)
        run: pnpm docs:api:check

      - name: Test (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package exports (attw + publint)
        run: pnpm check:exports

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: widget/pnpm-lock.yaml

      # On pull requests, size-limit-action builds this branch and the base
      # branch, fails the job if any budget in widget/.size-limit.json is
      # exceeded, and posts a PR comment with raw/gzip/brotli sizes and the
      # diff against the base.
      - name: Size limit (PR comment + gate)
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          directory: widget
          # The action defaults to `npx size-limit --json`, which installs a
          # standalone size-limit that can't see the widget's local
          # @size-limit/file plugin, so run the locally installed binary. The
          # action also builds the base branch with the same script; fall back
          # to an empty result set there if that commit predates size-limit
          # (the action renders missing base entries as "+100%").
          script: bash -c "if [ -x node_modules/.bin/size-limit ]; then node_modules/.bin/size-limit --json; else echo []; fi"

      # On pushes to main there is no PR to comment on; just enforce budgets.
      - name: Install dependencies
        if: github.event_name != 'pull_request'
        working-directory: widget
        run: pnpm install --frozen-lockfile

      - name: Build
        if: github.event_name != 'pull_request'
        working-directory: widget
        run: pnpm build

      - name: Size limit (gate)
        if: github.event_name != 'pull_request'
        working-directory: widget
        run: pnpm size

  worker:
    name: Validate Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (Vitest)
        run: pnpm test

  create-claudius:
    name: Validate create-claudius
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-claudius
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: create-claudius/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
