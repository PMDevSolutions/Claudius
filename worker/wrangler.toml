name = "claudius-chat-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
# Optional: Configure Claude model (default: claude-haiku-4-5-20251001)
# CLAUDE_MODEL = "claude-haiku-4-5-20251001"
# Optional: Configure max response tokens (default: 1024)
# MAX_TOKENS = "1024"
# Optional: Override the compiled-in system prompt (worker/src/system-prompt.ts)
# SYSTEM_PROMPT = "You are ..."
# Optional: Configure rate limits (defaults: 10/min, 50/hr)
# RATE_LIMIT_MINUTE = "10"
# RATE_LIMIT_HOUR = "50"
# Optional: RAG tuning (used only when the Vectorize + AI bindings below are
# enabled). See docs: /rag.
# RAG_TOP_K = "4"
# RAG_SCORE_THRESHOLD = "0.5"
# RAG_CONTEXT_TEMPLATE = "...{context}..."
#
# Attachments (images + PDFs on user messages). Enabled by default in
# "passthrough" mode: files are forwarded to Anthropic and never stored.
# ATTACHMENTS_ENABLED = "true"
# ATTACHMENT_TYPES = "image/jpeg,image/png,image/gif,image/webp,application/pdf"
# ATTACHMENT_MAX_BYTES = "5242880"            # per file (5 MB)
# ATTACHMENT_MAX_COUNT = "5"                  # per message
# ATTACHMENT_MAX_REQUEST_BYTES = "20971520"   # forwarded per request (20 MB)
# ATTACHMENT_QUOTA_IP_BYTES = "52428800"      # per IP per UTC day; 0 disables
# ATTACHMENT_QUOTA_TENANT_BYTES = "524288000" # per tenant per UTC day; 0 disables
# TENANT_ID = "acme"                          # quota tenant; defaults to the Origin host
#
# Optional R2 storage: keeps uploads for ATTACHMENT_RETENTION_HOURS so later
# turns reference them by key instead of re-uploading. Requires the
# [[r2_buckets]] binding below and `wrangler secret put ATTACHMENT_SIGNING_SECRET`.
# ATTACHMENT_STORAGE = "r2"
# ATTACHMENT_RETENTION_HOURS = "24"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "placeholder"
preview_id = "placeholder"

# R2 bucket for attachment storage (only when ATTACHMENT_STORAGE = "r2").
# Create with `npx wrangler r2 bucket create claudius-attachments` and add an
# object lifecycle rule that deletes objects after your retention window.
# [[r2_buckets]]
# binding = "ATTACHMENTS"
# bucket_name = "claudius-attachments"

# D1 database for analytics events. Optional: if omitted, the chat
# endpoint still works but no events are recorded. See DEPLOY.md for
# the wrangler commands to create the DB and run migrations, then
# uncomment this block and paste in the real database_id.
# [[d1_databases]]
# binding = "ANALYTICS_DB"
# database_name = "claudius-analytics"
# database_id = "your-d1-database-id"

# RAG (retrieval-augmented generation). Uncomment BOTH blocks to activate:
# the Worker embeds each question with Workers AI, queries the Vectorize
# index, and grounds replies in the retrieved chunks (with source links).
# Create the index (dimensions must match the embedding model, 768 for
# @cf/baai/bge-base-en-v1.5):
#   wrangler vectorize create claudius-rag --dimensions=768 --metric=cosine
# then ingest content with:  pnpm rag:ingest ./content
# [[vectorize]]
# binding = "VECTORIZE_INDEX"
# index_name = "claudius-rag"
#
# [ai]
# binding = "AI"
